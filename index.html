<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- html2canvas for JPG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- heic2any for iPhone HEIC image conversion support -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Tailwind slate-100 */
        }

        /* Styling for editable content to look like normal text until focused */
        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease-in-out;
            border-radius: 4px;
            padding: 2px 4px;
            border: 1px solid transparent;
        }
        
        [contenteditable="true"]:hover {
            background-color: rgba(0, 0, 0, 0.03);
            border-color: #cbd5e1;
        }

        [contenteditable="true"]:focus {
            background-color: #fef08a; /* Yellow highlight when editing */
            border-color: #eab308;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
        }

        /* Print and Export Specific Styles */
        @media print {
            body {
                background-color: white !important;
            }
            .no-print {
                display: none !important;
            }
            #main-wrapper {
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .category-block {
                page-break-inside: avoid;
                break-inside: avoid;
                margin-bottom: 2rem;
            }
            /* Hide empty image containers when printing */
            .image-container:not(.has-image) {
                display: none !important;
            }
            /* Force colors to print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Class added dynamically during JPG export to hide non-relevant elements */
        body.hide-for-export .no-print,
        body.hide-for-export .delete-col,
        body.hide-for-export .image-container:not(.has-image) {
            display: none !important;
        }
        
        /* Ensure table layout doesn't break html2canvas capture on mobile */
        body.hide-for-export .table-responsive-wrapper {
            overflow: visible !important;
        }
        
        body.hide-for-export #export-area {
             width: 1000px !important; /* Force a standard desktop width for clean JPG export */
             margin: 0 auto;
        }

        /* Custom Toast Animation */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.3s ease-out forwards;
        }
    </style>
</head>

        const mainContainer = document.getElementById('export-area');
        
        // Custom UI components to replace native window alerts and confirms
        function showCustomConfirm(message, onConfirm) {
            const modalId = 'modal-' + Date.now();
            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up">
                <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
                    <div class="flex items-center text-red-600 mb-4">
                        <i class="fas fa-exclamation-triangle text-2xl mr-3"></i>
                        <h4 class="text-xl font-bold text-slate-800">Konfirmasi</h4>
                    </div>
                    <p class="mb-8 text-slate-600">${message}</p>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-md text-slate-800 font-medium transition-colors">Batal</button>
                        <button id="confirm-${modalId}" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md text-white font-medium transition-colors shadow-sm">Ya, Lanjutkan</button>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById(`cancel-${modalId}`).onclick = () => {
                document.getElementById(modalId).remove();
            };
            document.getElementById(`confirm-${modalId}`).onclick = () => {
                onConfirm();
                document.getElementById(modalId).remove();
            };
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded shadow-lg text-white font-medium animate-fade-in-up ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-times-circle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function initApp() {
            const savedData = localStorage.getItem('rimpang-checklist-data');
            if (savedData) {
                mainContainer.innerHTML = savedData;
                // Re-apply checked state for checkboxes
                document.querySelectorAll('.task-check').forEach(chk => {
                    chk.checked = chk.hasAttribute('checked');
                });
            } else {
                mainContainer.innerHTML = defaultHTML;
            }
        }
        
        let saveTimeout;
        function saveData() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('rimpang-checklist-data', mainContainer.innerHTML);
            }, 500);
        }

        // Now works seamlessly with Files and Blobs (after HEIC conversion)
        function compressImage(fileOrBlob, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(fileOrBlob);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    // Max width for reference images
                    const MAX_WIDTH = 1000; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to JPEG with 0.7 quality
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                }
            }
        }

        mainContainer.addEventListener('input', (e) => {
            saveData();
        });

        // Using async for the change event to handle HEIC parsing smoothly
        mainContainer.addEventListener('change', async (e) => {
            if (e.target.classList.contains('task-check')) {
                if (e.target.checked) {
                    e.target.setAttribute('checked', 'checked');
                } else {
                    e.target.removeAttribute('checked');
                }
                saveData();
            }
            
            // Handle Image Upload File Change (with HEIC support)
            if (e.target.classList.contains('image-upload-input')) {
                let file = e.target.files[0];
                if (!file) return;

                const container = e.target.closest('.image-container');
                const uploadBtn = container.querySelector('.trigger-upload-btn');
                const wrapper = container.querySelector('.uploaded-image-wrapper');
                const img = container.querySelector('img');

                // Show loading state on button
                const originalText = uploadBtn.innerHTML;
                
                try {
                    const fileName = file.name.toLowerCase();
                    const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';

                    if (isHeic) {
                        uploadBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin text-2xl mb-2 text-blue-500"></i><br><span class="text-sm font-medium text-blue-600">Mengkonversi format iPhone (HEIC)... Ini mungkin butuh beberapa detik.</span>';
                        
                        // Execute conversion via heic2any
                        const convertedBlob = await heic2any({
                            blob: file,
                            toType: "image/jpeg",
                            quality: 0.8 // High quality for intermediate blob
                        });
                        
                        // heic2any returns an array of blobs if sequence, otherwise single blob
                        file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    } else {
                        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br><span class="text-sm font-medium">Memproses gambar...</span>';
                    }

                    // Once we have a JPEG/PNG (either natively or converted), run existing compression
                    compressImage(file, (base64) => {
                        img.src = base64;
                        // Set attributes for state saving
                        img.setAttribute('src', base64);
                        
                        uploadBtn.classList.add('hidden');
                        wrapper.classList.remove('hidden');
                        container.classList.add('has-image');
                        
                        uploadBtn.innerHTML = originalText; // Reset button text for future
                        e.target.value = ''; // Clear input
                        
                        saveData();
                        showToast("Gambar berhasil dimuat!");
                    });

                } catch (err) {
                    console.error("Gagal memproses gambar:", err);
                    showToast("Gagal memuat gambar. Pastikan file valid.", true);
                    uploadBtn.innerHTML = originalText;
                    e.target.value = '';
                }
            }
        });

        mainContainer.addEventListener('click', (e) => {
            // Trigger File Input Click
            if (e.target.closest('.trigger-upload-btn')) {
                const btn = e.target.closest('.trigger-upload-btn');
                const fileInput = btn.parentElement.querySelector('.image-upload-input');
                fileInput.click();
            }

            // Remove Image
            if (e.target.closest('.remove-image-btn')) {
                const btn = e.target.closest('.remove-image-btn');
                const container = btn.closest('.image-container');
                const uploadBtn = container.querySelector('.trigger-upload-btn');
                const wrapper = container.querySelector('.uploaded-image-wrapper');
                const img = container.querySelector('img');

                img.src = "";
                img.removeAttribute('src');
                wrapper.classList.add('hidden');
                uploadBtn.classList.remove('hidden');
                container.classList.remove('has-image');
                
                saveData();
            }

            // Add Row
            if (e.target.closest('.add-row-btn')) {
                const btn = e.target.closest('.add-row-btn');
                const tbody = btn.parentElement.previousElementSibling.querySelector('tbody');
                tbody.insertAdjacentHTML('beforeend', generateRow());
                saveData();
            }
            
            // Delete Row
            if (e.target.closest('.delete-row-btn')) {
                const tr = e.target.closest('tr');
                showCustomConfirm('Apakah Anda yakin ingin menghapus baris tugas ini?', () => {
                    tr.remove();
                    saveData();
                });
            }

            // Delete Category
            if (e.target.closest('.delete-cat-btn')) {
                const catBlock = e.target.closest('.category-block');
                showCustomConfirm('PERINGATAN: Hapus seluruh kategori tahapan ini beserta semua barisnya?', () => {
                    catBlock.remove();
                    saveData();
                });
            }

            // Add Category
            if (e.target.closest('#add-cat-btn')) {
                const wrapper = document.getElementById('categories-wrapper');
                const newId = 'cat_' + Date.now();
                const newCat = `
                <div class="category-block mb-8 rounded-md overflow-hidden shadow-sm border border-slate-300">
                    <div class="flex justify-between items-center bg-slate-800 text-white p-3 md:p-4">
                        <h3 contenteditable="true" class="font-bold text-lg flex-1"><i class="fas fa-cube mr-2 text-slate-300"></i>Tahap Baru: Judul Tahapan</h3>
                        <button class="delete-cat-btn no-print text-slate-400 hover:text-red-400 ml-4 transition-colors"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    ${generateImageBlock(newId)}
                    <div class="table-responsive-wrapper overflow-x-auto w-full bg-white">
                        <table class="w-full border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-y border-slate-300">
                                    <th class="border-r border-slate-300 p-3 w-16 text-center font-semibold">Status</th>
                                    <th class="border-r border-slate-300 p-3 text-left font-semibold">Deskripsi Pekerjaan</th>
                                    <th class="border-r border-slate-300 p-3 w-24 text-center font-semibold">Qty</th>
                                    <th class="border-r border-slate-300 p-3 text-left w-1/3 font-semibold">Keterangan Spesifik</th>
                                    <th class="p-2 w-10 text-center no-print delete-col">#</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${generateRow()}
                            </tbody>
                        </table>
                    </div>
                    <div class="bg-white p-2 border-t border-slate-300">
                        <button class="add-row-btn no-print text-blue-600 font-semibold text-sm flex items-center gap-1 hover:text-blue-800 transition-colors"><i class="fas fa-plus-circle"></i> Tambah Item Pekerjaan</button>
                    </div>
                </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', newCat);
                saveData();
                showToast("Kategori baru berhasil ditambahkan!");
            }
        });

        async function exportToJPG() {
            const btn = document.getElementById('btn-jpg');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            
            // Scroll ke atas agar tidak ada area hitam yang terpotong oleh html2canvas
            window.scrollTo(0, 0);
            
            // Tambahkan class hide-for-export untuk menyembunyikan tombol UI dan mengatur ukuran area
            document.body.classList.add('hide-for-export');
            
            // Beri waktu sejenak agar browser merender ulang layout (terutama pengaturan fixed width)
            setTimeout(async () => {
                try {
                    const captureArea = document.getElementById('export-area');
                    const canvas = await html2canvas(captureArea, {
                        scale: 2, // Resolusi tinggi
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        windowWidth: 1000 // Paksa ukuran window untuk export konsisten
                    });
                    
                    const link = document.createElement('a');
                    link.download = 'Checklist_Rimpang_Digital.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    showToast("JPG Berhasil diekspor!");
                } catch(err) {
                    showToast("Terjadi kesalahan saat mengekspor gambar", true);
                    console.error(err);
                } finally {
                    // Kembalikan tampilan UI seperti semula
                    document.body.classList.remove('hide-for-export');
                    btn.innerHTML = originalText;
                }
            }, 300);
        }

        function exportToCSV() {
            let csvData = [];
            // Header Row
            csvData.push("Kategori Tahapan,Status Penyelesaian,Deskripsi Pekerjaan / Modul,Quantity,Keterangan Tambahan");

            const categories = document.querySelectorAll('.category-block');
            categories.forEach(cat => {
                let catTitleRaw = cat.querySelector('h3').innerText || "";
                let catTitle = `"${catTitleRaw.replace(/"/g, '""')}"`;

                const rows = cat.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    let isChecked = row.querySelector('.task-check').checked ? "SELESAI" : "BELUM";
                    let desc = `"${row.cells[1].innerText.replace(/"/g, '""')}"`;
                    let qty = `"${row.cells[2].innerText.replace(/"/g, '""')}"`;
                    let note = `"${row.cells[3].innerText.replace(/"/g, '""')}"`;

                    csvData.push(`${catTitle},${isChecked},${desc},${qty},${note}`);
                });
            });

            let csvContent = csvData.join("\n");
            let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            
            if (navigator.msSaveBlob) { 
                navigator.msSaveBlob(blob, "Checklist_Rimpang_Digital.csv");
            } else {
                link.href = URL.createObjectURL(blob);
                link.download = "Checklist_Rimpang_Digital.csv";
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            showToast("Spreadsheet berhasil diunduh!");
        }

        // Modified reset function using custom confirmation Modal
        function reqResetData() {
            showCustomConfirm(
                "PERINGATAN: Anda yakin ingin menghapus SEMUA data yang sudah diedit (termasuk gambar) dan mengembalikannya ke template awal?",
                () => {
                    localStorage.removeItem('rimpang-checklist-data');
                    location.reload();
                }
            );
        }

        // Menjalankan inisiasi saat halaman dimuat
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
