<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimpang Digital Kreatif - Checklist Produksi & Pemasangan</title>
    
    <!-- Tailwind CSS for rapid, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- html2canvas for JPG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- heic2any for iPhone HEIC image conversion support -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Tailwind slate-100 */
        }

        /* Styling for editable content to look like normal text until focused */
        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease-in-out;
            border-radius: 4px;
            padding: 2px 4px;
            border: 1px solid transparent;
        }
        
        [contenteditable="true"]:hover {
            background-color: rgba(0, 0, 0, 0.03);
            border-color: #cbd5e1;
        }

        [contenteditable="true"]:focus {
            background-color: #fef08a; /* Yellow highlight when editing */
            border-color: #eab308;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
        }

        /* Print and Export Specific Styles */
        @media print {
            body {
                background-color: white !important;
            }
            .no-print {
                display: none !important;
            }
            #main-wrapper {
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .category-block {
                page-break-inside: avoid;
                break-inside: avoid;
                margin-bottom: 2rem;
            }
            /* Hide empty image containers when printing */
            .image-container:not(.has-image) {
                display: none !important;
            }
            /* Force colors to print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Class added dynamically during JPG export to hide non-relevant elements */
        body.hide-for-export .no-print,
        body.hide-for-export .delete-col,
        body.hide-for-export .image-container:not(.has-image) {
            display: none !important;
        }
        
        /* Ensure table layout doesn't break html2canvas capture on mobile */
        body.hide-for-export .table-responsive-wrapper {
            overflow: visible !important;
        }
        
        body.hide-for-export #export-area {
             width: 1000px !important; /* Force a standard desktop width for clean JPG export */
             margin: 0 auto;
        }

        /* Custom Toast and Modal Animations */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.3s ease-out forwards;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- Action Toolbar (Fixed Top) -->
    <div class="action-bar fixed top-0 left-0 w-full bg-slate-900 text-white shadow-xl p-3 flex flex-wrap gap-2 sm:gap-4 justify-center z-40 no-print items-center">
        <div class="font-bold text-lg mr-2 sm:mr-4 text-emerald-400 hidden lg:block">
            <i class="fas fa-leaf mr-2"></i>Rimpang Tools
        </div>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm">
            <i class="fas fa-print mr-2"></i> Ekspor PDF
        </button>
        <button onclick="exportToJPG()" id="btn-jpg" class="bg-purple-600 hover:bg-purple-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm">
            <i class="fas fa-image mr-2"></i> Ekspor JPG
        </button>
        <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm">
            <i class="fas fa-file-excel mr-2"></i> Ekspor CSV
        </button>
        <!-- Tombol Pengaturan Alarm Baru -->
        <button onclick="openAlarmSettings()" class="bg-amber-600 hover:bg-amber-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm relative">

            <span id="alarm-indicator" class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full hidden border-2 border-slate-900"></span>
        </button>
        <button onclick="reqResetData()" class="bg-red-600 hover:bg-red-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm md:ml-auto">
            <i class="fas fa-sync-alt mr-2"></i> Reset Template
        </button>
    </div>

    <!-- Main Content Area -->
    <div id="main-wrapper" class="mt-32 md:mt-24 max-w-5xl mx-auto shadow-2xl relative bg-white">
        <!-- This is the specific area that will be captured for JPG and Print -->
        <div id="export-area" class="p-6 md:p-12 min-h-screen">
            <!-- Dynamic Content will be injected here via JavaScript -->
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 no-print"></div>

    <script>
        // Custom UI components to replace native window alerts and confirms
        function showCustomConfirm(message, onConfirm) {
            const modalId = 'modal-' + Date.now();
            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up">
                <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
                    <div class="flex items-center text-red-600 mb-4">
                        <i class="fas fa-exclamation-triangle text-2xl mr-3"></i>
                        <h4 class="text-xl font-bold text-slate-800">Konfirmasi</h4>
                    </div>
                    <p class="mb-8 text-slate-600">${message}</p>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-md text-slate-800 font-medium transition-colors">Batal</button>
                        <button id="confirm-${modalId}" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md text-white font-medium transition-colors shadow-sm">Ya, Lanjutkan</button>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById(`cancel-${modalId}`).onclick = () => {
                document.getElementById(modalId).remove();
            };
            document.getElementById(`confirm-${modalId}`).onclick = () => {
                onConfirm();
                document.getElementById(modalId).remove();
            };
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded shadow-lg text-white font-medium animate-fade-in-up ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-times-circle' : 'fa-check-circle'} mr-2"></i> ${message}`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Function to analyze image on canvas and generate smart offline AI data without API Key
        function analyzeImageSimulateAI(imgElement, rowCount) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            // Ensure minimum dimensions exist
            canvas.width = imgElement.naturalWidth || imgElement.width || 100;
            canvas.height = imgElement.naturalHeight || imgElement.height || 100;
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
            
            // Analyze aspect ratio to determine shape
            const isLandscape = canvas.width > canvas.height;
            const isSquare = Math.abs(canvas.width - canvas.height) < (canvas.width * 0.1); // 10% tolerance
            
            // Analyze dominant color (sample middle area to avoid transparent/white borders)
            let r = 0, g = 0, b = 0;
            try {
                const sampleSize = Math.min(50, Math.floor(canvas.width/2));
                const startX = Math.floor(canvas.width / 2) - Math.floor(sampleSize/2);
                const startY = Math.floor(canvas.height / 2) - Math.floor(sampleSize/2);
                
                const imgData = ctx.getImageData(startX > 0 ? startX : 0, startY > 0 ? startY : 0, sampleSize, sampleSize).data;
                let count = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    r += imgData[i];
                    g += imgData[i+1];
                    b += imgData[i+2];
                    count++;
                }
                r = Math.floor(r/count) || 0;
                g = Math.floor(g/count) || 0;
                b = Math.floor(b/count) || 0;
            } catch(e) {
                // Fallback for tainted canvas (should not happen for local files)
                r = 150; g = 150; b = 150;
            }
            
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            const colorType = brightness > 128 ? 'Terang (Light)' : 'Gelap (Dark)';
            
            function rgbToHex(r, g, b) {
                return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase().padStart(6, '0');
            }
            const colorHex = rgbToHex(r,g,b);
            const shapeStr = isSquare ? "Modul Simetris/Kubus" : (isLandscape ? "Modul Memanjang (Lebar)" : "Modul Vertikal (Tinggi)");

            let generatedData = [];
            
            // Generate Contextual Data based on Canvas analysis
            generatedData.push({
                d: `[AI] ${shapeStr} Utama`, 
                q: "1 Set", 
                n: `Struktur utama, AI mendeteksi rasio ${canvas.width}x${canvas.height}px.`
            });
            
            generatedData.push({
                d: `[AI] Pelapisan / Finishing Warna`, 
                q: "Full Area", 
                n: `Dominan warna ${colorType} (Mendekati kode hex ${colorHex}).`
            });
            
            generatedData.push({
                d: `[AI] Komponen Pendukung Rangka`, 
                q: "Sesuai Kebutuhan", 
                n: `Dimensi visual mengindikasikan butuh perkuatan rangka dalam.`
            });

            generatedData.push({
                d: `[AI] Instalasi Jalur Elektrikal`, 
                q: "1 Lot", 
                n: `Deteksi area khusus: Siapkan jalur tersembunyi untuk utilitas.`
            });

            generatedData.push({
                d: `[AI] Penempelan Visual / Stiker`, 
                q: "1 Set", 
                n: `Pemasangan presisi di area dominan yang terdeteksi.`
            });
            
            // Generate generic tasks if there are more rows to fill
            let extraTasks = [
                {d: "[AI] Pekerjaan Penyesuaian Detail (Touch-up)", q: "Opsional", n: "Pengecekan dan perapihan tepi modul yang tidak rata."},
                {d: "[AI] Quality Control (QC) Visual", q: "1 Lot", n: "Pastikan hasil rapi sesuai referensi gambar render."},
                {d: "[AI] Persiapan Rakitan (Joinery)", q: "Set", n: "Siapkan pengunci baut berdasarkan ketebalan yang terdeteksi."}
            ];

            let extraIndex = 0;
            while(generatedData.length < rowCount) {
                generatedData.push(extraTasks[extraIndex % extraTasks.length]);
                extraIndex++;
            }

            return generatedData;
        }

        // Default Template matching the 3D model reference
        function generateRow(desc = "Pekerjaan baru...", qty = "1", note = "") {
            return `
            <tr class="task-row hover:bg-slate-50 transition-colors group">
                <td class="border border-slate-300 p-2 text-center align-middle">
                    <div class="flex items-center justify-center h-full">
                        <input type="checkbox" class="task-check w-6 h-6 cursor-pointer accent-slate-800 rounded">
                    </div>
                </td>
                <td class="border border-slate-300 p-2 align-top"><div contenteditable="true" class="min-h-[1.5em] w-full">${desc}</div></td>
                <td class="border border-slate-300 p-2 text-center align-top"><div contenteditable="true" class="min-h-[1.5em] w-full">${qty}</div></td>
                <td class="border border-slate-300 p-2 align-top"><div contenteditable="true" class="min-h-[1.5em] w-full text-sm text-slate-600">${note}</div></td>
                <td class="border border-slate-300 p-1 text-center no-print delete-col align-middle opacity-0 group-hover:opacity-100 transition-opacity">
                    <button class="delete-row-btn text-red-400 hover:text-red-600 font-bold p-1 rounded hover:bg-red-50 transition-colors" title="Hapus Baris ini"><i class="fas fa-times"></i></button>
                </td>
            </tr>
            `;
        }

        function generateImageBlock(categoryId) {
            return `
            <div class="image-container p-4 bg-slate-50 border-x border-slate-300 relative text-center flex flex-col items-center justify-center min-h-[100px]">
                <input type="file" class="hidden image-upload-input" accept="image/*,.heic,.heif" data-cat="${categoryId}">
                
                <!-- State: No Image -->
                <button class="trigger-upload-btn text-slate-400 hover:text-blue-500 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded p-4 w-full md:w-1/2 transition-colors no-print">
                    <i class="fas fa-cloud-upload-alt text-2xl mb-2"></i><br>
                    <span class="text-sm font-medium">Klik untuk Upload Gambar Referensi Tahapan (Termasuk format iPhone HEIC)</span>
                </button>

                <!-- State: Has Image -->
                <div class="uploaded-image-wrapper hidden relative group max-w-full">
                    <img src="" class="max-h-80 rounded shadow-md object-contain border border-slate-200">
                    <button class="remove-image-btn absolute -top-3 -right-3 bg-red-600 hover:bg-red-700 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity no-print" title="Hapus Gambar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            `;
        }

        const defaultHTML = `
            <!-- Header Section -->
            <div class="text-center mb-8 pb-6 border-b-[3px] border-slate-800 relative">
                <h1 contenteditable="true" class="text-3xl md:text-4xl font-bold text-slate-900 mb-2 uppercase tracking-wide">RIMPANG DIGITAL KREATIF</h1>
                <h2 contenteditable="true" class="text-lg md:text-xl font-semibold text-slate-600">Checklist Produksi & Pemasangan Booth Pameran</h2>
                <p contenteditable="true" class="text-sm text-slate-500 italic mt-1 no-print">(Semua teks, angka, dan gambar di dokumen ini dapat diubah/diklik)</p>
                
                <div class="mt-6 flex flex-col md:flex-row justify-between text-sm text-slate-700 font-medium gap-4">
                    <div class="flex items-center gap-2">
                        <span class="font-bold">Nama Proyek:</span>
                        <span contenteditable="true" class="border-b border-slate-300 min-w-[250px] text-left inline-block px-1 text-base text-blue-700">Booth Pameran Interaktif (Sesuai 3D)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold">Tanggal:</span>
                        <span contenteditable="true" class="border-b border-slate-300 min-w-[150px] text-left inline-block px-1">${new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}</span>
                    </div>
                </div>
            </div>

            <!-- Categories Container -->
            <div id="categories-wrapper">
                <!-- Tahap 1: Struktur -->
                <div class="category-block mb-8 rounded-md overflow-hidden shadow-sm border border-slate-300">
                    <div class="flex justify-between items-center bg-slate-800 text-white p-3 md:p-4">
                        <h3 contenteditable="true" class="font-bold text-lg flex-1"><i class="fas fa-hammer mr-2 text-slate-300"></i>Tahap 1: Produksi Struktur & Woodworking</h3>
                        <button class="delete-cat-btn no-print text-slate-400 hover:text-red-400 ml-4 transition-colors" title="Hapus Kategori Ini"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    ${generateImageBlock('cat_1')}
                    <div class="table-responsive-wrapper overflow-x-auto w-full bg-white">
                        <table class="w-full border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-y border-slate-300">
                                    <th class="border-r border-slate-300 p-3 w-16 text-center font-semibold">Status</th>
                                    <th class="border-r border-slate-300 p-3 text-left font-semibold">Komponen / Modul (P x L x T)</th>
                                    <th class="border-r border-slate-300 p-3 w-24 text-center font-semibold">Qty</th>
                                    <th class="border-r border-slate-300 p-3 text-left w-1/3 font-semibold">Keterangan Spesifik</th>
                                    <th class="p-2 w-10 text-center no-print delete-col">#</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${generateRow("Pembuatan Base Modul Paling Kiri (150 x 45 x 45 cm)", "1 Set", "Material Multiplek tebal. Ada grafis peta di atasnya nanti.")}
                                ${generateRow("Pembuatan Pilar Merah Modul Kiri (15 x 15 x 60 cm)", "1 Pcs", "Berdiri di atas base kiri, terdapat angka '2' timbul/grafis.")}
                                ${generateRow("Pembuatan Modul Tengah Kiri (60 x 60 x 75 cm)", "1 Set", "Siapkan lubang/ceruk di bagian atas untuk monitor/display kotak.")}
                                ${generateRow("Pembuatan Modul Tengah Utama (105 x 60 x 60 cm)", "1 Set", "Menyambung dengan modul tinggi.")}
                            </tbody>
                        </table>
                    </div>
                    <div class="bg-white p-2 border-t border-slate-300">
                        <button class="add-row-btn no-print text-blue-600 font-semibold text-sm flex items-center gap-1 hover:text-blue-800 transition-colors"><i class="fas fa-plus-circle"></i> Tambah Item Pekerjaan</button>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-10 mb-4 no-print border-t-2 border-dashed border-slate-300 pt-8">
                <button id="add-cat-btn" class="bg-slate-700 hover:bg-slate-800 text-white px-6 py-3 rounded-md font-semibold shadow transition-all flex items-center justify-center mx-auto">
                    <i class="fas fa-layer-group mr-2"></i> Tambah Kategori Tahapan Baru
                </button>
            </div>
        `;

        const mainContainer = document.getElementById('export-area');
        
        function initApp() {
            const savedData = localStorage.getItem('rimpang-checklist-data');
            if (savedData) {
                mainContainer.innerHTML = savedData;
                // Re-apply checked state for checkboxes
                document.querySelectorAll('.task-check').forEach(chk => {
                    chk.checked = chk.hasAttribute('checked');
                });
            } else {
                mainContainer.innerHTML = defaultHTML;
            }
            // Inisialisasi logic sistem Alarm
            initAlarmSystem();
        }
        
        let saveTimeout;
        function saveData() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('rimpang-checklist-data', mainContainer.innerHTML);
            }, 500);
        }

        let alarmCheckTimer;
        let audioCtx; // Diinisialisasi nanti karena interaksi user
        
        function initAlarmSystem() {
            updateAlarmIndicator();
            if(alarmCheckTimer) clearInterval(alarmCheckTimer);
            // Mengecek status alarm setiap 10 detik
            alarmCheckTimer = setInterval(checkIfTimeToAlert, 10000); 
        }

        function unlockAudio() {
            // Trick untuk bypass browser audio autoplary policy saat user klik
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateAlarmIndicator() {
            const isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';
            const indicator = document.getElementById('alarm-indicator');
            if (isEnabled) {
                indicator.classList.remove('hidden');
                indicator.classList.add('block');
            } else {
                indicator.classList.add('hidden');
                indicator.classList.remove('block');
            }
        }

        function openAlarmSettings() {
            unlockAudio(); // Unlock audio context when user interacts
            const modalId = 'alarm-modal-' + Date.now();
            let currentInterval = localStorage.getItem('rimpang-alarm-interval') || 3;
            let isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';

            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up">
                <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
                    <div class="flex items-center text-amber-600 mb-4">
                        <i class="fas fa-clock text-2xl mr-3"></i>
                        <h4 class="text-xl font-bold text-slate-800">Pengaturan Alarm Progress</h4>
                    </div>
                    <p class="text-sm text-slate-600 mb-6">Alarm ini akan membunyikan nada dan pop-up untuk mengingatkan Anda mengupdate checklist secara berkala.</p>
                    
                    <div class="mb-4 flex items-center justify-between bg-slate-50 p-3 rounded-md border border-slate-200">
                        <div class="text-slate-700 font-semibold">Status Alarm</div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="alarm-toggle-input" class="sr-only peer" ${isEnabled ? 'checked' : ''}>
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                        </label>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Ingatkan saya setiap (Jam):</label>
                        <input type="number" id="alarm-interval-input" value="${currentInterval}" min="0.01" step="0.1" class="w-full border border-slate-300 rounded-md px-3 py-2 text-slate-700 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors">
                        <p class="text-xs text-slate-500 mt-2"><b>Tips:</b> Ketik <b>3</b> untuk 3 jam. Anda juga bisa mengisi desimal (misal <b>0.1</b> = 6 menit) untuk tes.</p>
                    </div>

                    <div class="flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-md text-slate-800 font-medium transition-colors">Batal</button>
                        <button id="save-${modalId}" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 rounded-md text-white font-medium transition-colors shadow-sm">Simpan</button>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById(`cancel-${modalId}`).onclick = () => {
                document.getElementById(modalId).remove();
            };

            document.getElementById(`save-${modalId}`).onclick = () => {
                const toggleVal = document.getElementById('alarm-toggle-input').checked;
                const intervalVal = parseFloat(document.getElementById('alarm-interval-input').value) || 3;
                
                const finalInterval = intervalVal <= 0 ? 3 : intervalVal;
                const wasEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';

                localStorage.setItem('rimpang-alarm-enabled', toggleVal);
                localStorage.setItem('rimpang-alarm-interval', finalInterval);

                if (toggleVal) {
                    const nextTime = Date.now() + (finalInterval * 60 * 60 * 1000); 
                    localStorage.setItem('rimpang-alarm-next-time', nextTime);
                    
                    if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                        Notification.requestPermission();
                    }
                    showToast(`Alarm diaktifkan! Akan berbunyi dalam ${finalInterval} jam.`);
                } else if (wasEnabled && !toggleVal) {
                    showToast("Alarm berhasil dinonaktifkan.");
                }

                updateAlarmIndicator();
                document.getElementById(modalId).remove();
            };
        }

        function checkIfTimeToAlert() {
            const isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';
            if (!isEnabled) return;

            const nextTimeStr = localStorage.getItem('rimpang-alarm-next-time');
            if (!nextTimeStr) return;

            const nextTime = parseInt(nextTimeStr);
            if (Date.now() >= nextTime) {
                triggerAlarmAction();
                const intervalVal = parseFloat(localStorage.getItem('rimpang-alarm-interval')) || 3;
                const newNextTime = Date.now() + (intervalVal * 60 * 60 * 1000);
                localStorage.setItem('rimpang-alarm-next-time', newNextTime);
            }
        }

        function triggerAlarmAction() {
            playBeepSound();

            const modalId = 'alarm-trigger-' + Date.now();
            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-80 no-print animate-fade-in-up">
                <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl text-center border-4 border-amber-400">
                    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-amber-100 mb-6 animate-pulse-ring">
                        <i class="fas fa-bell text-4xl text-amber-500 animate-bounce"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Waktunya Update!</h2>
                    <p class="text-slate-600 mb-8">Ini adalah pengingat rutin Anda untuk mengupdate progres/checklist pekerjaan hari ini.</p>
                    <button id="ok-${modalId}" class="w-full px-4 py-3 bg-slate-800 hover:bg-slate-900 rounded-lg text-white font-bold text-lg transition-colors shadow-lg">
                        Oke, Saya Cek Sekarang!
                    </button>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById(`ok-${modalId}`).onclick = () => {
                document.getElementById(modalId).remove();
            };

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Rimpang Digital - Alarm Progress", {
                    body: "Waktunya update progress checklist pekerjaan Anda saat ini!",
                    icon: "https://cdn-icons-png.flaticon.com/512/825/825590.png"
                });
            }
        }

        function playBeepSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const playNote = (time, freq, dur) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                    osc.start(time);
                    osc.stop(time + dur);
                };

                const t = audioCtx.currentTime;
                playNote(t, 880, 0.3);       
                playNote(t + 0.4, 880, 0.3); 
                playNote(t + 0.8, 1046.5, 0.5); 
            } catch (e) {
                console.warn("Audio tidak dapat dimainkan di browser ini.");
            }
        }

        function compressImage(fileOrBlob, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(fileOrBlob);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                }
            }
        }

        mainContainer.addEventListener('input', (e) => {
            saveData();
        });

        mainContainer.addEventListener('change', async (e) => {
            if (e.target.classList.contains('task-check')) {
                if (e.target.checked) {
                    e.target.setAttribute('checked', 'checked');
                } else {
                    e.target.removeAttribute('checked');
                }
                saveData();
            }
            
            // Handle Image Upload File Change + Offline AI Execution
            if (e.target.classList.contains('image-upload-input')) {
                let file = e.target.files[0];
                if (!file) return;

                const container = e.target.closest('.image-container');
                const uploadBtn = container.querySelector('.trigger-upload-btn');
                const wrapper = container.querySelector('.uploaded-image-wrapper');
                const img = container.querySelector('img');

                const originalText = uploadBtn.innerHTML;
                
                try {
                    const fileName = file.name.toLowerCase();
                    const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic' || file.type === 'image/heif';

                    if (isHeic) {
                        uploadBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin text-2xl mb-2 text-blue-500"></i><br><span class="text-sm font-medium text-blue-600">Mengkonversi format iPhone (HEIC)...</span>';
                        
                        const convertedBlob = await heic2any({
                            blob: file,
                            toType: "image/jpeg",
                            quality: 0.8
                        });
                        file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    } else {
                        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br><span class="text-sm font-medium">Memproses gambar...</span>';
                    }

                    compressImage(file, (base64) => {
                        img.src = base64;
                        img.setAttribute('src', base64);
                        
                        uploadBtn.classList.add('hidden');
                        wrapper.classList.remove('hidden');
                        container.classList.add('has-image');
                        
                        uploadBtn.innerHTML = originalText;
                        e.target.value = ''; 
                        
                        // --- START LOCAL AI VISION LOGIC (NO API KEY) ---
                        const categoryBlock = container.closest('.category-block');
                        const tbody = categoryBlock.querySelector('tbody');
                        let rows = tbody.querySelectorAll('tr');
                        
                        // Jika baris kosong (terhapus manual), otomatis buat template untuk diisi AI
                        if (rows.length === 0) {
                            for(let i=0; i<4; i++) {
                                tbody.insertAdjacentHTML('beforeend', generateRow());
                            }
                            rows = tbody.querySelectorAll('tr');
                        }
                        
                        // 1. Kosongkan isi terlebih dahulu dan berikan indikasi AI sedang memproses
                        rows.forEach(row => {
                            let divDesc = row.cells[1].querySelector('div');
                            let divQty = row.cells[2].querySelector('div');
                            let divNote = row.cells[3].querySelector('div');
                            
                            divDesc.innerHTML = '<span class="text-blue-600 font-bold animate-pulse"><i class="fas fa-brain mr-2"></i>AI Vision Menganalisis...</span>';
                            divQty.innerHTML = '<span class="animate-pulse">...</span>';
                            divNote.innerHTML = '<span class="animate-pulse">...</span>';
                            
                            divDesc.className = "min-h-[1.5em] w-full text-slate-500 font-medium";
                            divNote.className = "min-h-[1.5em] w-full text-sm text-slate-500";
                        });

                        showToast("Local AI Vision diaktifkan. Membaca piksel gambar...", false);

                        // 2. Simulasi penundaan untuk memberi waktu algoritma Canvas membaca gambar
                        setTimeout(() => {
                            // Panggil fungsi ekstraksi warna dan dimensi (AI Simulasi)
                            const aiResult = analyzeImageSimulateAI(img, rows.length);
                            
                            // 3. Masukkan data ke dalam masing-masing baris secara otomatis
                            rows.forEach((row, index) => {
                                let divDesc = row.cells[1].querySelector('div');
                                let divQty = row.cells[2].querySelector('div');
                                let divNote = row.cells[3].querySelector('div');
                                
                                divDesc.className = "min-h-[1.5em] w-full text-blue-800 font-semibold"; 
                                divNote.className = "min-h-[1.5em] w-full text-sm text-slate-700";
                                
                                let data = aiResult[index];
                                divDesc.innerText = data.d;
                                divQty.innerText = data.q;
                                divNote.innerText = data.n;
                            });

                            saveData();
                            showToast("Pengenalan Gambar Selesai. Checklist Otomatis Diperbarui!");
                        }, 2500);
                        // --- END LOCAL AI VISION LOGIC ---
                        
                        saveData();
                    });

                } catch (err) {
                    console.error("Gagal memproses gambar:", err);
                    showToast("Gagal memuat gambar. Pastikan file valid.", true);
                    uploadBtn.innerHTML = originalText;
                    e.target.value = '';
                }
            }
        });

        mainContainer.addEventListener('click', (e) => {
            if (e.target.closest('.trigger-upload-btn')) {
                const btn = e.target.closest('.trigger-upload-btn');
                const fileInput = btn.parentElement.querySelector('.image-upload-input');
                fileInput.click();
            }

            if (e.target.closest('.remove-image-btn')) {
                const btn = e.target.closest('.remove-image-btn');
                const container = btn.closest('.image-container');
                const uploadBtn = container.querySelector('.trigger-upload-btn');
                const wrapper = container.querySelector('.uploaded-image-wrapper');
                const img = container.querySelector('img');

                img.src = "";
                img.removeAttribute('src');
                wrapper.classList.add('hidden');
                uploadBtn.classList.remove('hidden');
                container.classList.remove('has-image');
                
                saveData();
            }

            if (e.target.closest('.add-row-btn')) {
                const btn = e.target.closest('.add-row-btn');
                const tbody = btn.parentElement.previousElementSibling.querySelector('tbody');
                tbody.insertAdjacentHTML('beforeend', generateRow());
                saveData();
            }
            
            if (e.target.closest('.delete-row-btn')) {
                const tr = e.target.closest('tr');
                showCustomConfirm('Apakah Anda yakin ingin menghapus baris tugas ini?', () => {
                    tr.remove();
                    saveData();
                });
            }

            if (e.target.closest('.delete-cat-btn')) {
                const catBlock = e.target.closest('.category-block');
                showCustomConfirm('PERINGATAN: Hapus seluruh kategori tahapan ini beserta semua barisnya?', () => {
                    catBlock.remove();
                    saveData();
                });
            }

            if (e.target.closest('#add-cat-btn')) {
                const wrapper = document.getElementById('categories-wrapper');
                const newId = 'cat_' + Date.now();
                const newCat = `
                <div class="category-block mb-8 rounded-md overflow-hidden shadow-sm border border-slate-300">
                    <div class="flex justify-between items-center bg-slate-800 text-white p-3 md:p-4">
                        <h3 contenteditable="true" class="font-bold text-lg flex-1"><i class="fas fa-cube mr-2 text-slate-300"></i>Tahap Baru: Judul Tahapan</h3>
                        <button class="delete-cat-btn no-print text-slate-400 hover:text-red-400 ml-4 transition-colors"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    ${generateImageBlock(newId)}
                    <div class="table-responsive-wrapper overflow-x-auto w-full bg-white">
                        <table class="w-full border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-y border-slate-300">
                                    <th class="border-r border-slate-300 p-3 w-16 text-center font-semibold">Status</th>
                                    <th class="border-r border-slate-300 p-3 text-left font-semibold">Deskripsi Pekerjaan</th>
                                    <th class="border-r border-slate-300 p-3 w-24 text-center font-semibold">Qty</th>
                                    <th class="border-r border-slate-300 p-3 text-left w-1/3 font-semibold">Keterangan Spesifik</th>
                                    <th class="p-2 w-10 text-center no-print delete-col">#</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${generateRow()}
                            </tbody>
                        </table>
                    </div>
                    <div class="bg-white p-2 border-t border-slate-300">
                        <button class="add-row-btn no-print text-blue-600 font-semibold text-sm flex items-center gap-1 hover:text-blue-800 transition-colors"><i class="fas fa-plus-circle"></i> Tambah Item Pekerjaan</button>
                    </div>
                </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', newCat);
                saveData();
                showToast("Kategori baru berhasil ditambahkan!");
            }
        });

        async function exportToJPG() {
            const btn = document.getElementById('btn-jpg');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            
            window.scrollTo(0, 0);
            document.body.classList.add('hide-for-export');
            
            setTimeout(async () => {
                try {
                    const captureArea = document.getElementById('export-area');
                    const canvas = await html2canvas(captureArea, {
                        scale: 2, 
                        useCORS: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        windowWidth: 1000 
                    });
                    
                    const link = document.createElement('a');
                    link.download = 'Checklist_Rimpang_Digital.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    showToast("JPG Berhasil diekspor!");
                } catch(err) {
                    showToast("Terjadi kesalahan saat mengekspor gambar", true);
                    console.error(err);
                } finally {
                    document.body.classList.remove('hide-for-export');
                    btn.innerHTML = originalText;
                }
            }, 300);
        }

        function exportToCSV() {
            let csvData = [];
            csvData.push("Kategori Tahapan,Status Penyelesaian,Deskripsi Pekerjaan / Modul,Quantity,Keterangan Tambahan");

            const categories = document.querySelectorAll('.category-block');
            categories.forEach(cat => {
                let catTitleRaw = cat.querySelector('h3').innerText || "";
                let catTitle = `"${catTitleRaw.replace(/"/g, '""')}"`;

                const rows = cat.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    let isChecked = row.querySelector('.task-check').checked ? "SELESAI" : "BELUM";
                    let desc = `"${row.cells[1].innerText.replace(/"/g, '""')}"`;
                    let qty = `"${row.cells[2].innerText.replace(/"/g, '""')}"`;
                    let note = `"${row.cells[3].innerText.replace(/"/g, '""')}"`;

                    csvData.push(`${catTitle},${isChecked},${desc},${qty},${note}`);
                });
            });

            let csvContent = csvData.join("\n");
            let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            
            if (navigator.msSaveBlob) { 
                navigator.msSaveBlob(blob, "Checklist_Rimpang_Digital.csv");
            } else {
                link.href = URL.createObjectURL(blob);
                link.download = "Checklist_Rimpang_Digital.csv";
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            showToast("Spreadsheet berhasil diunduh!");
        }

        function reqResetData() {
            showCustomConfirm(
                "PERINGATAN: Anda yakin ingin menghapus SEMUA data yang sudah diedit (termasuk gambar) dan mengembalikannya ke template awal?",
                () => {
                    localStorage.removeItem('rimpang-checklist-data');
                    localStorage.removeItem('rimpang-alarm-enabled');
                    localStorage.removeItem('rimpang-alarm-interval');
                    localStorage.removeItem('rimpang-alarm-next-time');
                    location.reload();
                }
            );
        }

        // Menjalankan inisiasi saat halaman dimuat
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
