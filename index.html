        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded shadow-lg text-white font-medium animate-fade-in-up flex items-center gap-2 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-times-circle' : 'fa-check-circle'}"></i> <span>${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Fungsi Penganalisis Gambar Terpadu (ML Murni + Kanvas Heuristik)
        async function analyzeImageRealAI(imgElement, rowCount) {
            let generatedData = [];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = imgElement.naturalWidth || imgElement.width || 500;
            canvas.height = imgElement.naturalHeight || imgElement.height || 500;
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);

            // 1. Ekstrak Properti Fisik Gambar (Bentuk & Warna Dasar)
            const isLandscape = canvas.width > canvas.height;
            const isSquare = Math.abs(canvas.width - canvas.height) < (canvas.width * 0.1);
            let r = 0, g = 0, b = 0, colorHex = "#FFFFFF", colorType = "Terang";
            
            try {
                const sampleSize = Math.min(100, Math.floor(canvas.width/2));
                const startX = Math.floor(canvas.width / 2) - Math.floor(sampleSize/2);
                const startY = Math.floor(canvas.height / 2) - Math.floor(sampleSize/2);
                const imgData = ctx.getImageData(startX > 0 ? startX : 0, startY > 0 ? startY : 0, sampleSize, sampleSize).data;
                let count = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    r += imgData[i]; g += imgData[i+1]; b += imgData[i+2]; count++;
                }
                r = Math.floor(r/count) || 0; g = Math.floor(g/count) || 0; b = Math.floor(b/count) || 0;
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                colorType = brightness > 128 ? 'Terang (Light)' : 'Gelap (Dark)';
                colorHex = "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase().padStart(6, '0');
            } catch(e) { console.warn("Canvas color extraction failed", e); }

            const shapeStr = isSquare ? "Modul Simetris/Kubus" : (isLandscape ? "Modul Memanjang" : "Modul Vertikal Tinggi");
            
            // Tambahkan Data Analisis Fisik ke array
            generatedData.push({
                d: `[Fisik] Produksi Rangka ${shapeStr}`, 
                q: "1 Set", 
                n: `Area ${canvas.width}x${canvas.height}px. Finishing warna ${colorType} (${colorHex}).`
            });

            // 2. Deteksi Objek via TensorFlow.js (COCO-SSD)
            if (tfObjectModel) {
                try {
                    const predictions = await tfObjectModel.detect(imgElement);
                    if (predictions && predictions.length > 0) {
                        // Hilangkan duplikat dan gabungkan objek serupa
                        const uniqueObjects = {};
                        predictions.forEach(p => {
                            if (p.score > 0.4) { // Confidence > 40%
                                if(!uniqueObjects[p.class]) uniqueObjects[p.class] = [];
                                uniqueObjects[p.class].push(p.bbox); // Simpan bounding box [x,y,width,height]
                            }
                        });

                        for (const [objName, boxes] of Object.entries(uniqueObjects)) {
                            // Kalkulasi ukuran relatif berdasarkan rata-rata bounding box
                            let avgWidth = 0, avgHeight = 0;
                            boxes.forEach(b => { avgWidth += b[2]; avgHeight += b[3]; });
                            avgWidth = Math.round(avgWidth / boxes.length);
                            avgHeight = Math.round(avgHeight / boxes.length);
                            
                            const relativeArea = (avgWidth * avgHeight) / (canvas.width * canvas.height);
                            let ukuranLabel = "Kecil/Aksesoris";
                            if (relativeArea > 0.4) ukuranLabel = "Besar/Utama";
                            else if (relativeArea > 0.15) ukuranLabel = "Sedang/Pendukung";

                            generatedData.push({
                                d: `[AI-Visual] Instalasi/Pemasangan ${objName.toUpperCase()}`,
                                q: `${boxes.length} Unit`,
                                n: `Deteksi AI: Proporsi ukuran ${ukuranLabel} (${avgWidth}x${avgHeight} px). Siapkan bracket/dudukan.`
                            });
                        }
                    }
                } catch (e) { console.error("TF Object Detection error", e); }
            }

            // 3. Optical Character Recognition (OCR) via Tesseract.js
            try {
                const ocrResult = await Tesseract.recognize(imgElement, 'eng', {
                    logger: m => {} // Abaikan log progress agar console bersih
                });
                
                // Ambil teks berbobot yang relevan
                let textFound = ocrResult.data.text.replace(/\n/g, ' ').trim();
                textFound = textFound.replace(/[^a-zA-Z0-9\s.,]/g, ''); // Bersihkan noise

                if (textFound.length > 3) {
                    const displayTxt = textFound.length > 25 ? textFound.substring(0, 25) + '...' : textFound;
                    generatedData.push({
                        d: `[AI-OCR] Pekerjaan Visual/Signage Teks`,
                        q: "1 Lot",
                        n: `Teks Terdeteksi: "${displayTxt}". Siapkan file print/cutting stiker yang sesuai.`
                    });
                }
            } catch (e) { console.error("Tesseract OCR error", e); }

            // 4. Fallback / Pelengkap baris jika hasil deteksi kurang dari kebutuhan rowCount
            let extraTasks = [
                {d: "[Standar] Pekerjaan Penyesuaian Detail (Touch-up)", q: "Opsional", n: "Pengecekan sambungan/dempul modul utama."},
                {d: "[Standar] Quality Control (QC) Akhir", q: "1 Lot", n: "Pastikan semua dimensi aktual sesuai dengan layout kerja."},
                {d: "[Standar] Persiapan Jalur Elektrikal/Kabel", q: "1 Set", n: "Siapkan lubang stopkontak & saklar (jika ada lampu)."}
            ];

            let extraIndex = 0;
            while(generatedData.length < rowCount && generatedData.length < 5) {
                generatedData.push(extraTasks[extraIndex % extraTasks.length]);
                extraIndex++;
            }

            return generatedData;
        }

                <p contenteditable="true" class="text-sm text-slate-500 italic mt-1 no-print">(Semua teks, angka, dan gambar di dokumen ini dapat diedit)</p>

        const mainContainer = document.getElementById('export-area');

        function initApp() {
            const savedData = localStorage.getItem('rimpang-checklist-data');
            if (savedData) {
                mainContainer.innerHTML = savedData;
                document.querySelectorAll('.task-check').forEach(chk => {
                    chk.checked = chk.hasAttribute('checked');
                });
            } else {
                mainContainer.innerHTML = defaultHTML;
            }
            initAlarmSystem();
            initAI(); // Initialize Real AI in background
        }
        
        let saveTimeout;
        function saveData() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('rimpang-checklist-data', mainContainer.innerHTML);
            }, 500);
        }

        mainContainer.addEventListener('input', (e) => saveData());

        mainContainer.addEventListener('change', async (e) => {
            if (e.target.classList.contains('task-check')) {
                if (e.target.checked) e.target.setAttribute('checked', 'checked');
                else e.target.removeAttribute('checked');
                saveData();
            }
            
            // Image Upload Event -> Trigger Real AI
            if (e.target.classList.contains('image-upload-input')) {
                let file = e.target.files[0];
                if (!file) return;

                const container = e.target.closest('.image-container');
                const uploadBtn = container.querySelector('.trigger-upload-btn');
                const wrapper = container.querySelector('.uploaded-image-wrapper');
                const img = container.querySelector('img');
                const originalText = uploadBtn.innerHTML;
                
                try {
                    const fileName = file.name.toLowerCase();
                    const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic';

                    if (isHeic) {
                        uploadBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin text-2xl mb-2 text-blue-500"></i><br><span class="text-sm font-medium text-blue-600">Konversi HEIC...</span>';
                        const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
                        file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    } else {
                        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl mb-2 text-purple-600"></i><br><span class="text-sm font-medium">Memproses gambar...</span>';
                    }

                    // Compress Image for Canvas
                    compressImage(file, async (base64) => {
                        img.src = base64;
                        img.setAttribute('src', base64);
                        uploadBtn.classList.add('hidden');
                        wrapper.classList.remove('hidden');
                        container.classList.add('has-image');
                        uploadBtn.innerHTML = originalText;
                        e.target.value = ''; 
                        
                        // ===== MULAI PROSES REAL AI =====
                        const categoryBlock = container.closest('.category-block');
                        const tbody = categoryBlock.querySelector('tbody');
                        let rows = tbody.querySelectorAll('tr');
                        
                        if (rows.length === 0) {
                            for(let i=0; i<4; i++) tbody.insertAdjacentHTML('beforeend', generateRow());
                            rows = tbody.querySelectorAll('tr');
                        }
                        
                        // Tampilkan status loading di tabel
                        rows.forEach(row => {
                            let divDesc = row.cells[1].querySelector('div');
                            let divQty = row.cells[2].querySelector('div');
                            let divNote = row.cells[3].querySelector('div');
                            divDesc.innerHTML = '<span class="text-purple-600 font-bold animate-pulse"><i class="fas fa-microchip mr-2"></i>Mesin AI & OCR Menganalisis Objek & Teks...</span>';
                            divQty.innerHTML = '<span class="animate-pulse">...</span>';
                            divNote.innerHTML = '<span class="animate-pulse">...</span>';
                        });

                        showToast("Menganalisis gambar menggunakan Machine Learning secara offline...");

                        // Pastikan model sudah siap, jika belum tunggu 1 detik
                        if (!isAILoaded && !tfObjectModel) {
                            showToast("Menunggu Model AI dimuat sepenuhnya...", false);
                            await new Promise(r => setTimeout(r, 1500));
                        }

                        // Panggil Engine AI Nyata
                        const aiResult = await analyzeImageRealAI(img, rows.length);
                        
                        // Masukkan Data Hasil AI ke Tabel
                        rows.forEach((row, index) => {
                            let divDesc = row.cells[1].querySelector('div');
                            let divQty = row.cells[2].querySelector('div');
                            let divNote = row.cells[3].querySelector('div');
                            
                            divDesc.className = "min-h-[1.5em] w-full text-indigo-900 font-semibold"; 
                            divNote.className = "min-h-[1.5em] w-full text-sm text-slate-700";
                            
                            let data = aiResult[index] || { d: "Pekerjaan Kustom", q: "-", n: "-" };
                            divDesc.innerText = data.d;
                            divQty.innerText = data.q;
                            divNote.innerText = data.n;
                        });

                        saveData();
                        showToast("Analisis AI Selesai! Checklist diperbarui.");
                    });
                } catch (err) {
                    console.error("Gambar gagal diproses", err);
                    showToast("Gagal memuat/menganalisis gambar.", true);
                    uploadBtn.innerHTML = originalText;
                }
            }
        });

        mainContainer.addEventListener('click', (e) => {
            if (e.target.closest('.trigger-upload-btn')) {
                e.target.closest('.trigger-upload-btn').parentElement.querySelector('.image-upload-input').click();
            }

            if (e.target.closest('.remove-image-btn')) {
                const btn = e.target.closest('.remove-image-btn');
                const container = btn.closest('.image-container');
                container.querySelector('img').removeAttribute('src');
                container.querySelector('.uploaded-image-wrapper').classList.add('hidden');
                container.querySelector('.trigger-upload-btn').classList.remove('hidden');
                container.classList.remove('has-image');
                saveData();
            }

            if (e.target.closest('.add-row-btn')) {
                const tbody = e.target.closest('.add-row-btn').parentElement.previousElementSibling.querySelector('tbody');
                tbody.insertAdjacentHTML('beforeend', generateRow());
                saveData();
            }
            
            if (e.target.closest('.delete-row-btn')) {
                const tr = e.target.closest('tr');
                showCustomConfirm('Hapus baris tugas ini?', () => { tr.remove(); saveData(); });
            }

            if (e.target.closest('.delete-cat-btn')) {
                const catBlock = e.target.closest('.category-block');
                showCustomConfirm('PERINGATAN: Hapus seluruh kategori tahapan ini?', () => { catBlock.remove(); saveData(); });
            }

            if (e.target.closest('#add-cat-btn')) {
                const wrapper = document.getElementById('categories-wrapper');
                const newId = 'cat_' + Date.now();
                const newCat = `
                <div class="category-block mb-8 rounded-md overflow-hidden shadow-sm border border-slate-300">
                    <div class="flex justify-between items-center bg-slate-800 text-white p-3 md:p-4">
                        <h3 contenteditable="true" class="font-bold text-lg flex-1"><i class="fas fa-cube mr-2 text-slate-300"></i>Tahap Baru: Judul</h3>
                        <button class="delete-cat-btn no-print text-slate-400 hover:text-red-400 ml-4 transition-colors"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    ${generateImageBlock(newId)}
                    <div class="table-responsive-wrapper overflow-x-auto w-full bg-white">
                        <table class="w-full border-collapse min-w-[600px]">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-y border-slate-300">
                                    <th class="border-r border-slate-300 p-3 w-16 text-center font-semibold">Status</th>
                                    <th class="border-r border-slate-300 p-3 text-left font-semibold">Deskripsi Pekerjaan</th>
                                    <th class="border-r border-slate-300 p-3 w-24 text-center font-semibold">Qty</th>
                                    <th class="border-r border-slate-300 p-3 text-left w-1/3 font-semibold">Keterangan Spesifik</th>
                                    <th class="p-2 w-10 text-center no-print delete-col">#</th>
                                </tr>
                            </thead>
                            <tbody>${generateRow()}</tbody>
                        </table>
                    </div>
                    <div class="bg-white p-2 border-t border-slate-300">
                        <button class="add-row-btn no-print text-blue-600 font-semibold text-sm flex items-center gap-1 hover:text-blue-800 transition-colors"><i class="fas fa-plus-circle"></i> Tambah Item Pekerjaan</button>
                    </div>
                </div>`;
                wrapper.insertAdjacentHTML('beforeend', newCat);
                saveData();
                showToast("Kategori berhasil ditambahkan!");
            }
        });

        function compressImage(fileOrBlob, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(fileOrBlob);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            }
        }

        async function exportToJPG() {
            const btn = document.getElementById('btn-jpg');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            window.scrollTo(0, 0);
            document.body.classList.add('hide-for-export');
            
            setTimeout(async () => {
                try {
                    const canvas = await html2canvas(document.getElementById('export-area'), {
                        scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff', windowWidth: 1000 
                    });
                    const link = document.createElement('a');
                    link.download = 'Checklist_Rimpang.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    showToast("JPG Berhasil diekspor!");
                } catch(err) {
                    showToast("Gagal mengekspor JPG", true);
                } finally {
                    document.body.classList.remove('hide-for-export');
                    btn.innerHTML = originalText;
                }
            }, 300);
        }

        function exportToCSV() {
            let csvData = ["Kategori Tahapan,Status,Deskripsi Pekerjaan,Quantity,Keterangan"];
            document.querySelectorAll('.category-block').forEach(cat => {
                let catTitle = `"${(cat.querySelector('h3').innerText || "").replace(/"/g, '""')}"`;
                cat.querySelectorAll('tbody tr').forEach(row => {
                    let isChecked = row.querySelector('.task-check').checked ? "SELESAI" : "BELUM";
                    let desc = `"${row.cells[1].innerText.replace(/"/g, '""')}"`;
                    let qty = `"${row.cells[2].innerText.replace(/"/g, '""')}"`;
                    let note = `"${row.cells[3].innerText.replace(/"/g, '""')}"`;
                    csvData.push(`${catTitle},${isChecked},${desc},${qty},${note}`);
                });
            });
            let blob = new Blob([csvData.join("\n")], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Checklist_Rimpang.csv";
            link.click();
            showToast("CSV berhasil diunduh!");
        }

        function reqResetData() {
            showCustomConfirm("Hapus SEMUA data dan kembalikan ke awal?", () => {
                localStorage.clear(); location.reload();
            });
        }

        /* --- SISTEM ALARM --- */
        let alarmCheckTimer;
        let audioCtx; 
        
        function initAlarmSystem() {
            updateAlarmIndicator();
            if(alarmCheckTimer) clearInterval(alarmCheckTimer);
            alarmCheckTimer = setInterval(checkIfTimeToAlert, 10000); 
        }

        function unlockAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function updateAlarmIndicator() {
            const isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';
            const ind = document.getElementById('alarm-indicator');
            if (isEnabled) ind.classList.replace('hidden', 'block');
            else ind.classList.replace('block', 'hidden');
        }

        function openAlarmSettings() {
            unlockAudio(); 
            const modalId = 'alarm-modal-' + Date.now();
            let currentInt = localStorage.getItem('rimpang-alarm-interval') || 3;
            let isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';

            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up">
                <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
                    <div class="flex items-center text-amber-600 mb-4">
                        <i class="fas fa-clock text-2xl mr-3"></i><h4 class="text-xl font-bold">Pengaturan Alarm</h4>
                    </div>
                    <div class="mb-4 flex justify-between bg-slate-50 p-3 rounded border border-slate-200">
                        <div class="font-semibold">Status Alarm</div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="alarm-toggle" class="sr-only peer" ${isEnabled ? 'checked' : ''}>
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-amber-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                        </label>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2">Ingatkan setiap (Jam):</label>
                        <input type="number" id="alarm-int" value="${currentInt}" min="0.01" step="0.1" class="w-full border rounded px-3 py-2">
                    </div>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-medium">Batal</button>
                        <button id="save-${modalId}" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded font-medium">Simpan</button>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById(`cancel-${modalId}`).onclick = () => document.getElementById(modalId).remove();
            document.getElementById(`save-${modalId}`).onclick = () => {
                const toggleVal = document.getElementById('alarm-toggle').checked;
                const intervalVal = Math.max(parseFloat(document.getElementById('alarm-int').value) || 3, 0.01);
                
                localStorage.setItem('rimpang-alarm-enabled', toggleVal);
                localStorage.setItem('rimpang-alarm-interval', intervalVal);

                if (toggleVal) {
                    localStorage.setItem('rimpang-alarm-next-time', Date.now() + (intervalVal * 3600000));
                    if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();
                    showToast(`Alarm diaktifkan! Berbunyi dalam ${intervalVal} jam.`);
                }
                updateAlarmIndicator();
                document.getElementById(modalId).remove();
            };
        }

        function checkIfTimeToAlert() {
            if (localStorage.getItem('rimpang-alarm-enabled') !== 'true') return;
            const nextTime = parseInt(localStorage.getItem('rimpang-alarm-next-time'));
            if (nextTime && Date.now() >= nextTime) {
                triggerAlarmAction();
                const intervalVal = parseFloat(localStorage.getItem('rimpang-alarm-interval')) || 3;
                localStorage.setItem('rimpang-alarm-next-time', Date.now() + (intervalVal * 3600000));
            }
        }

        function triggerAlarmAction() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const playNote = (time, freq, dur) => {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.value = freq; gain.gain.setValueAtTime(0.3, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                    osc.start(time); osc.stop(time + dur);
                };
                const t = audioCtx.currentTime;
                playNote(t, 880, 0.3); playNote(t + 0.4, 880, 0.3); playNote(t + 0.8, 1046.5, 0.5); 
            } catch (e) {}

            const modalId = 'alarm-trigger-' + Date.now();
            document.body.insertAdjacentHTML('beforeend', `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-80 animate-fade-in-up">
                <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center border-4 border-amber-400">
                    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-amber-100 mb-6 animate-pulse-ring">
                        <i class="fas fa-bell text-4xl text-amber-500 animate-bounce"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Waktunya Update!</h2>
                    <p class="mb-8">Jangan lupa update progres pekerjaan hari ini.</p>
                    <button id="ok-${modalId}" class="w-full px-4 py-3 bg-slate-800 text-white font-bold rounded-lg shadow-lg">Oke, Cek Sekarang</button>
                </div>
            </div>`);
            document.getElementById(`ok-${modalId}`).onclick = () => document.getElementById(modalId).remove();
            
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Rimpang Digital - Update Progress", { body: "Silakan update checklist." });
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
