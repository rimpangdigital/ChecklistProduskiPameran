<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimpang Digital Kreatif - Checklist Produksi & Pemasangan</title>
    
    <!-- Tailwind CSS for rapid, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Utilities -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <!-- REAL AI LIBRARIES (Offline / No API Key) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.2/dist/tesseract.min.js"></script>

    <!-- PDF.js untuk Penampil PDF Natif -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        if (window['pdfjs-dist/build/pdf']) {
            window.pdfjsLib = window['pdfjs-dist/build/pdf'];
        }
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; 
        }

        [contenteditable="true"] {
            outline: none;
            transition: all 0.2s ease-in-out;
            border-radius: 4px;
            padding: 2px 4px;
            border: 1px solid transparent;
        }
        
        [contenteditable="true"]:hover {
            background-color: rgba(0, 0, 0, 0.03);
            border-color: #cbd5e1;
        }

        [contenteditable="true"]:focus {
            background-color: #fef08a; 
            border-color: #eab308;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
        }

        /* Kelas khusus untuk menyembunyikan kategori saat ekspor parsial */
        .temp-hide-export {
            display: none !important;
        }

        @media print {
            body { background-color: white !important; }
            .no-print { display: none !important; }
            #main-wrapper { margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
            .category-block { page-break-inside: avoid; break-inside: avoid; margin-bottom: 2rem; }
            .image-container:not(.has-image) { display: none !important; }
            
            /* Expand PDF viewer for print */
            .pdf-render-container {
                max-height: none !important;
                overflow: visible !important;
                background-color: transparent !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            
            .embed-setup, .embed-header, .iframe-container iframe { display: none !important; }
            .print-fallback { display: flex !important; }
            
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        body.hide-for-export .no-print,
        body.hide-for-export .delete-col,
        body.hide-for-export .image-container:not(.has-image),
        body.hide-for-export .embed-setup,
        body.hide-for-export .embed-header,
        body.hide-for-export .iframe-container iframe {
            display: none !important;
        }
        
        body.hide-for-export .pdf-render-container {
            max-height: none !important;
            overflow: visible !important;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        body.hide-for-export .print-fallback { display: flex !important; }
        body.hide-for-export .table-responsive-wrapper { overflow: visible !important; }
        body.hide-for-export #export-area { width: 1000px !important; margin: 0 auto; }

        .print-fallback {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            background-color: #f8fafc;
            border-bottom: 1px solid #cbd5e1;
        }

        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 0.3s ease-out forwards; }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
        
        #ai-status-badge {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <div class="action-bar fixed top-0 left-0 w-full bg-slate-900 text-white shadow-xl p-3 flex flex-wrap gap-2 sm:gap-4 justify-center z-40 no-print items-center">
        <div class="font-bold text-lg mr-2 sm:mr-4 text-emerald-400 hidden lg:flex items-center gap-2">
            <i class="fas fa-leaf"></i>Rimpang Tools
            <span id="ai-status-badge" class="ml-2 text-[10px] bg-slate-700 px-2 py-1 rounded-full text-slate-300 flex items-center">
                <i class="fas fa-circle-notch fa-spin mr-1"></i> Memuat AI...
            </span>
        </div>
        <!-- Tombol Ekspor sekarang memanggil modal terlebih dahulu -->
        <button onclick="openExportModal('pdf')" class="bg-blue-600 hover:bg-blue-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm">
            <i class="fas fa-print mr-2"></i> Ekspor PDF
        </button>
        <button onclick="openExportModal('jpg')" id="btn-jpg" class="bg-purple-600 hover:bg-purple-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm">
            <i class="fas fa-image mr-2"></i> Ekspor JPG
        </button>
        <button onclick="openExportModal('csv')" class="bg-emerald-600 hover:bg-emerald-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm">
            <i class="fas fa-file-excel mr-2"></i> Ekspor CSV
        </button>
        <button onclick="openAlarmSettings()" class="bg-amber-600 hover:bg-amber-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm relative">
            <i class="fas fa-bell mr-2"></i> Alarm
            <span id="alarm-indicator" class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full hidden border-2 border-slate-900"></span>
        </button>
        <button onclick="reqResetData()" class="bg-red-600 hover:bg-red-500 px-3 sm:px-4 py-2 rounded-md font-medium flex items-center transition-colors text-sm sm:text-base shadow-sm md:ml-auto">
            <i class="fas fa-sync-alt mr-2"></i> Reset Template
        </button>
    </div>

    <div id="main-wrapper" class="mt-32 md:mt-24 max-w-5xl mx-auto shadow-2xl relative bg-white">
        <div id="export-area" class="p-6 md:p-12 min-h-screen">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 no-print"></div>

    <script>
        let tfObjectModel = null;
        let isAILoaded = false;

        // Custom Confirm Dialog
        function showCustomConfirm(message, onConfirm) {
            const modalId = 'modal-' + Date.now();
            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up">
                <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
                    <div class="flex items-center text-red-600 mb-4">
                        <i class="fas fa-exclamation-triangle text-2xl mr-3"></i>
                        <h4 class="text-xl font-bold text-slate-800">Konfirmasi</h4>
                    </div>
                    <p class="mb-8 text-slate-600">${message}</p>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-md text-slate-800 font-medium transition-colors">Batal</button>
                        <button id="confirm-${modalId}" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md text-white font-medium transition-colors shadow-sm">Ya, Lanjutkan</button>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById(`cancel-${modalId}`).onclick = () => document.getElementById(modalId).remove();
            document.getElementById(`confirm-${modalId}`).onclick = () => {
                onConfirm();
                document.getElementById(modalId).remove();
            };
        }

        // Toast Notification System
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded shadow-lg text-white font-medium animate-fade-in-up flex items-center gap-2 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-times-circle' : 'fa-check-circle'}"></i> <span>${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function openExportModal(exportType) {
            const categories = document.querySelectorAll('.category-block');
            if (categories.length === 0) {
                showToast("Tidak ada data kategori untuk diekspor.", true);
                return;
            }

            let checkboxHtml = '';
            categories.forEach((cat, index) => {
                const titleEl = cat.querySelector('h3');
                // Clean HTML tags from title for display
                const titleText = titleEl ? titleEl.innerText.trim() : `Kategori ${index + 1}`;
                cat.dataset.exportIdx = index; // Temp ID for matching
                
                checkboxHtml += `
                    <label class="flex items-center space-x-3 p-3 hover:bg-slate-50 cursor-pointer border-b border-slate-100 rounded transition-colors">
                        <input type="checkbox" class="export-cat-check w-5 h-5 text-blue-600 rounded focus:ring-blue-500" value="${index}" checked>
                        <span class="text-sm font-medium text-slate-700 truncate">${titleText}</span>
                    </label>
                `;
            });

            const modalId = 'export-modal-' + Date.now();
            const modalTitle = exportType === 'pdf' ? 'Ekspor ke PDF' : (exportType === 'jpg' ? 'Ekspor ke JPG' : 'Ekspor ke CSV');
            
            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up p-4">
                <div class="bg-white rounded-xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                    <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
                        <h4 class="text-lg font-bold"><i class="fas fa-tasks mr-2 text-blue-400"></i> Pilih Tahapan</h4>
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded">${modalTitle}</span>
                    </div>
                    <div class="p-4 text-sm text-slate-600 bg-slate-50 border-b">
                        Pilih kategori/tahapan mana saja yang ingin Anda sertakan dalam file ekspor.
                    </div>
                    <div class="p-2 flex-1 overflow-y-auto">
                        <div class="flex justify-between items-center p-2 mb-2 bg-slate-100 rounded">
                            <span class="text-sm font-bold text-slate-700">Pilih Semua</span>
                            <input type="checkbox" id="check-all-${modalId}" class="w-5 h-5 text-blue-600 rounded" checked>
                        </div>
                        <div class="space-y-1">
                            ${checkboxHtml}
                        </div>
                    </div>
                    <div class="p-4 border-t bg-slate-50 flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-md text-slate-800 font-medium transition-colors">Batal</button>
                        <button id="exec-${modalId}" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md text-white font-medium transition-colors shadow-sm flex items-center">
                            <i class="fas fa-file-export mr-2"></i> Lanjutkan Ekspor
                        </button>
                    </div>
                </div>
            </div>`;
            
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            // Handle Check All Toggle
            const checkAllBtn = document.getElementById(`check-all-${modalId}`);
            const individualChecks = document.querySelectorAll('.export-cat-check');
            
            checkAllBtn.addEventListener('change', (e) => {
                individualChecks.forEach(chk => chk.checked = e.target.checked);
            });

            // If an individual check is unchecked, uncheck the "Check All" button
            individualChecks.forEach(chk => {
                chk.addEventListener('change', () => {
                    if (!chk.checked) checkAllBtn.checked = false;
                    else {
                        const allChecked = Array.from(individualChecks).every(c => c.checked);
                        checkAllBtn.checked = allChecked;
                    }
                });
            });

            document.getElementById(`cancel-${modalId}`).onclick = () => document.getElementById(modalId).remove();
            
            document.getElementById(`exec-${modalId}`).onclick = async () => {
                const checkedValues = Array.from(document.querySelectorAll('.export-cat-check:checked')).map(cb => cb.value);
                
                if (checkedValues.length === 0) {
                    showToast("Harap pilih minimal 1 tahapan untuk diekspor.", true);
                    return;
                }

                // Sembunyikan kategori yang tidak dipilih
                categories.forEach(cat => {
                    if (!checkedValues.includes(cat.dataset.exportIdx)) {
                        cat.classList.add('temp-hide-export');
                    }
                });

                document.getElementById(modalId).remove();

                // Eksekusi fungsi ekspor spesifik
                try {
                    if (exportType === 'pdf') {
                        window.print();
                    } else if (exportType === 'jpg') {
                        await exportToJPG_Core();
                    } else if (exportType === 'csv') {
                        exportToCSV_Core();
                    }
                } catch (error) {
                    console.error("Export Error:", error);
                    showToast("Terjadi kesalahan saat mengekspor data.", true);
                } finally {
                    // Jika PDF, pembersihan dilakukan oleh event 'afterprint'
                    // Untuk JPG dan CSV, bersihkan langsung setelah selesai eksekusi (atau await selesai)
                    if(exportType !== 'pdf') {
                        cleanupExportHiding();
                    }
                }
            };
        }

        // Membersihkan class temporary setelah ekspor
        function cleanupExportHiding() {
            document.querySelectorAll('.category-block').forEach(cat => {
                cat.classList.remove('temp-hide-export');
                delete cat.dataset.exportIdx; // Bersihkan data attribute
            });
        }

        // Listener global untuk merestore tampilan setelah dialog Print OS ditutup
        window.addEventListener('afterprint', cleanupExportHiding);

        async function analyzeImageRealAI(imgElement, rowCount) {
            let generatedData = [];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = imgElement.naturalWidth || imgElement.width || 500;
            canvas.height = imgElement.naturalHeight || imgElement.height || 500;
            ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);

            // 1. Ekstrak Fisik
            const isLandscape = canvas.width > canvas.height;
            const isSquare = Math.abs(canvas.width - canvas.height) < (canvas.width * 0.1);
            let r = 0, g = 0, b = 0, colorHex = "#FFFFFF", colorType = "Terang";
            
            try {
                const sampleSize = Math.min(100, Math.floor(canvas.width/2));
                const startX = Math.floor(canvas.width / 2) - Math.floor(sampleSize/2);
                const startY = Math.floor(canvas.height / 2) - Math.floor(sampleSize/2);
                const imgData = ctx.getImageData(startX > 0 ? startX : 0, startY > 0 ? startY : 0, sampleSize, sampleSize).data;
                let count = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    r += imgData[i]; g += imgData[i+1]; b += imgData[i+2]; count++;
                }
                r = Math.floor(r/count) || 0; g = Math.floor(g/count) || 0; b = Math.floor(b/count) || 0;
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                colorType = brightness > 128 ? 'Terang (Light)' : 'Gelap (Dark)';
                colorHex = "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase().padStart(6, '0');
            } catch(e) { console.warn("Canvas color extraction failed", e); }

            const shapeStr = isSquare ? "Modul Simetris/Kubus" : (isLandscape ? "Modul Memanjang" : "Modul Vertikal Tinggi");
            generatedData.push({
                d: `[Fisik] Produksi Rangka ${shapeStr}`, 
                q: "1 Set", 
                n: `Area ${canvas.width}x${canvas.height}px. Finishing warna ${colorType} (${colorHex}).`
            });

            // 2. Deteksi Objek via TF
            if (tfObjectModel) {
                try {
                    const predictions = await tfObjectModel.detect(imgElement);
                    if (predictions && predictions.length > 0) {
                        const uniqueObjects = {};
                        predictions.forEach(p => {
                            if (p.score > 0.4) {
                                if(!uniqueObjects[p.class]) uniqueObjects[p.class] = [];
                                uniqueObjects[p.class].push(p.bbox);
                            }
                        });

                        for (const [objName, boxes] of Object.entries(uniqueObjects)) {
                            let avgWidth = 0, avgHeight = 0;
                            boxes.forEach(b => { avgWidth += b[2]; avgHeight += b[3]; });
                            avgWidth = Math.round(avgWidth / boxes.length);
                            avgHeight = Math.round(avgHeight / boxes.length);
                            
                            const relativeArea = (avgWidth * avgHeight) / (canvas.width * canvas.height);
                            let ukuranLabel = "Kecil/Aksesoris";
                            if (relativeArea > 0.4) ukuranLabel = "Besar/Utama";
                            else if (relativeArea > 0.15) ukuranLabel = "Sedang/Pendukung";

                            generatedData.push({
                                d: `[AI-Visual] Instalasi/Pemasangan ${objName.toUpperCase()}`,
                                q: `${boxes.length} Unit`,
                                n: `Deteksi AI: Proporsi ukuran ${ukuranLabel}. Siapkan bracket jika perlu.`
                            });
                        }
                    }
                } catch (e) { console.error("TF Object Detection error", e); }
            }

            // 3. OCR via Tesseract
            try {
                const ocrResult = await Tesseract.recognize(imgElement, 'eng', { logger: m => {} });
                let textFound = ocrResult.data.text.replace(/\n/g, ' ').trim();
                textFound = textFound.replace(/[^a-zA-Z0-9\s.,]/g, ''); 

                if (textFound.length > 3) {
                    const displayTxt = textFound.length > 25 ? textFound.substring(0, 25) + '...' : textFound;
                    generatedData.push({
                        d: `[AI-OCR] Pekerjaan Visual/Signage Teks`,
                        q: "1 Lot",
                        n: `Teks Terdeteksi: "${displayTxt}". Siapkan file print/cutting stiker yang sesuai.`
                    });
                }
            } catch (e) { console.error("Tesseract OCR error", e); }

            // 4. Fallback
            let extraTasks = [
                {d: "[Standar] Pekerjaan Penyesuaian Detail (Touch-up)", q: "Opsional", n: "Pengecekan sambungan/dempul modul utama."},
                {d: "[Standar] Quality Control (QC) Akhir", q: "1 Lot", n: "Pastikan dimensi aktual sesuai."},
                {d: "[Standar] Persiapan Jalur Elektrikal/Kabel", q: "1 Set", n: "Siapkan lubang stopkontak & saklar (jika ada lampu)."}
            ];

            let extraIndex = 0;
            while(generatedData.length < rowCount && generatedData.length < 5) {
                generatedData.push(extraTasks[extraIndex % extraTasks.length]);
                extraIndex++;
            }

            return generatedData;
        }

        async function initAI() {
            const badge = document.getElementById('ai-status-badge');
            try {
                tfObjectModel = await cocoSsd.load();
                isAILoaded = true;
                badge.innerHTML = '<i class="fas fa-brain mr-1 text-emerald-400"></i> AI Aktif';
                badge.classList.replace('text-slate-300', 'text-white');
                badge.classList.replace('bg-slate-700', 'bg-emerald-700');
            } catch (err) {
                console.error("Gagal memuat AI Model", err);
                badge.innerHTML = '<i class="fas fa-exclamation-triangle mr-1 text-red-400"></i> AI Offline';
                showToast("Koneksi gagal saat memuat AI. Checklist menggunakan mode standar.", true);
            }
        }

        function generateRow(desc = "Pekerjaan baru...", qty = "1", note = "") {
            return `
            <tr class="task-row hover:bg-slate-50 transition-colors group">
                <td class="border border-slate-300 p-2 text-center align-middle">
                    <div class="flex items-center justify-center h-full">
                        <input type="checkbox" class="task-check w-6 h-6 cursor-pointer accent-slate-800 rounded">
                    </div>
                </td>
                <td class="border border-slate-300 p-2 align-top"><div contenteditable="true" class="min-h-[1.5em] w-full">${desc}</div></td>
                <td class="border border-slate-300 p-2 text-center align-top"><div contenteditable="true" class="min-h-[1.5em] w-full">${qty}</div></td>
                <td class="border border-slate-300 p-2 align-top"><div contenteditable="true" class="min-h-[1.5em] w-full text-sm text-slate-600">${note}</div></td>
                <td class="border border-slate-300 p-1 text-center no-print delete-col align-middle opacity-0 group-hover:opacity-100 transition-opacity">
                    <button class="delete-row-btn text-red-400 hover:text-red-600 font-bold p-1 rounded hover:bg-red-50 transition-colors" title="Hapus Baris ini"><i class="fas fa-times"></i></button>
                </td>
            </tr>
            `;
        }

        function generateImageBlock(categoryId) {
            return `
            <div class="image-container p-4 bg-slate-50 border-x border-slate-300 relative text-center flex flex-col items-center justify-center min-h-[100px]">
                <input type="file" class="hidden image-upload-input" accept="image/*,.heic,.heif,.pdf" data-cat="${categoryId}">
                
                <button class="trigger-upload-btn text-slate-400 hover:text-blue-500 border-2 border-dashed border-slate-300 hover:border-blue-500 rounded p-4 w-full md:w-1/2 transition-colors no-print">
                    <i class="fas fa-file-upload text-2xl mb-2 text-slate-400"></i><br>
                    <span class="text-sm font-medium">Klik Upload Gambar / PDF & Biarkan AI Menganalisis</span>
                </button>

                <div class="uploaded-image-wrapper hidden relative group w-full max-w-3xl mx-auto">
                    <img src="" class="normal-image max-h-80 mx-auto rounded shadow-md object-contain border border-slate-200 hidden" crossorigin="anonymous">
                    
                    <div class="pdf-render-container hidden flex-col gap-3 w-full max-h-[600px] overflow-y-auto bg-slate-200/50 p-4 rounded border border-slate-300 shadow-inner">
                        <!-- PDF pages injected here -->
                    </div>

                    <button class="remove-image-btn absolute -top-3 -right-3 bg-red-600 hover:bg-red-700 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity no-print z-10" title="Hapus Berkas">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            `;
        }
        
        function generateEmbedInputBlock() {
            return `

                let pdfContainer = container.querySelector('.pdf-render-container');

                    pdfContainer = document.createElement('div');

                const originalText = uploadBtn.innerHTML;
                const fileName = file.name.toLowerCase();

                const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type === 'image/heic';
                
                try {
                    if (isPDF) {
                        if (typeof pdfjsLib === 'undefined') {
                            throw new Error("Pustaka PDF.js tidak dimuat dengan benar.");
                        }
                        
                        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl mb-2 text-red-500"></i><br><span class="text-sm font-medium">Merender File PDF...</span>';
                        
                        const fileReader = new FileReader();
                        fileReader.onload = async function() {
                            try {
                                const typedarray = new Uint8Array(this.result);
                                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                                pdfContainer.innerHTML = ''; 
                                
                                // Limit memory & localstorage use by rendering up to 5 pages
                                const numPages = Math.min(pdf.numPages, 5);
                                let firstPageBase64 = null;

                                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                                    const page = await pdf.getPage(pageNum);
                                    const viewport = page.getViewport({scale: 1.5}); 
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d');
                                    canvas.height = viewport.height;
                                    canvas.width = viewport.width;

                                    await page.render({canvasContext: ctx, viewport: viewport}).promise;
                                    const imgBase64 = canvas.toDataURL('image/jpeg', 0.8);
                                    
                                    if (pageNum === 1) firstPageBase64 = imgBase64;
                                    
                                    const imgEl = document.createElement('img');
                                    imgEl.src = imgBase64;
                                    imgEl.className = 'w-full h-auto shadow bg-white border border-slate-300 rounded-sm mb-2';
                                    pdfContainer.appendChild(imgEl);
                                }

                                if (pdf.numPages > 5) {
                                    pdfContainer.insertAdjacentHTML('beforeend', `<div class="text-xs text-center text-slate-600 p-2 font-medium bg-slate-300/30 rounded">Hanya menampilkan 5 halaman pertama untuk stabilitas aplikasi.</div>`);
                                }

                                if(img) img.classList.add('hidden');
                                pdfContainer.classList.remove('hidden');
                                uploadBtn.classList.add('hidden');
                                wrapper.classList.remove('hidden');
                                container.classList.add('has-image');
                                uploadBtn.innerHTML = originalText;
                                e.target.value = '';

                                showToast("Dokumen PDF berhasil dimuat!");

                                if (firstPageBase64) {
                                    const firstPageImg = new Image();
                                    firstPageImg.src = firstPageBase64;
                                    firstPageImg.onload = () => processAIForImage(firstPageImg, container);
                                } else {
                                    saveData();
                                }
                            } catch (err) {
                                console.error(err);
                                showToast("Gagal memproses dokumen PDF.", true);
                                uploadBtn.innerHTML = originalText;
                            }
                        };
                        fileReader.readAsArrayBuffer(file);
                        return;
                    }

                    if (isHeic) {
                        uploadBtn.innerHTML = '<i class="fas fa-sync-alt fa-spin text-2xl mb-2 text-blue-500"></i><br><span class="text-sm font-medium text-blue-600">Konversi HEIC...</span>';
                        const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
                        file = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    } else {
                        uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl mb-2 text-purple-600"></i><br><span class="text-sm font-medium">Memproses gambar...</span>';
                    }

                    compressImage(file, (base64) => {
                        if(img) {
                            img.src = base64;
                            img.setAttribute('src', base64);
                            img.classList.remove('hidden');
                        }
                        if (pdfContainer) pdfContainer.classList.add('hidden');
                        
                        uploadBtn.classList.add('hidden');
                        wrapper.classList.remove('hidden');
                        container.classList.add('has-image');
                        uploadBtn.innerHTML = originalText;
                        e.target.value = ''; 
                        
                        processAIForImage(img, container);
                    });

                } catch (err) {
                    console.error("Berkas gagal diproses", err);
                    showToast("Gagal memuat/menganalisis berkas.", true);
                    uploadBtn.innerHTML = originalText;
                }
            }
        });

        function compressImage(fileOrBlob, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(fileOrBlob);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
            }
        }

        function exportToCSV_Core() {
            let csvData = ["Kategori Tahapan,Status,Deskripsi Pekerjaan,Quantity,Keterangan"];
            
            // Hanya ambil kategori yang tidak disembunyikan (.temp-hide-export)
            const activeCategories = document.querySelectorAll('.category-block:not(.temp-hide-export)');
            
            if (activeCategories.length === 0) {
                showToast("Tidak ada data yang dipilih untuk diekspor ke CSV.", true);
                return;
            }

            activeCategories.forEach(cat => {
                let catTitle = `"${(cat.querySelector('h3').innerText || "").replace(/"/g, '""')}"`;
                cat.querySelectorAll('tbody tr').forEach(row => {
                    let isChecked = row.querySelector('.task-check').checked ? "SELESAI" : "BELUM";
                    let desc = `"${row.cells[1].innerText.replace(/"/g, '""')}"`;
                    let qty = `"${row.cells[2].innerText.replace(/"/g, '""')}"`;
                    let note = `"${row.cells[3].innerText.replace(/"/g, '""')}"`;
                    csvData.push(`${catTitle},${isChecked},${desc},${qty},${note}`);
                });
            });
            
            let blob = new Blob([csvData.join("\n")], { type: "text/csv;charset=utf-8;" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Checklist_Rimpang.csv";
            link.click();
            showToast("CSV berhasil diunduh!");
        }

            updateAlarmIndicator();
            if(alarmCheckTimer) clearInterval(alarmCheckTimer);
            alarmCheckTimer = setInterval(checkIfTimeToAlert, 10000); 
        }

        function unlockAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function updateAlarmIndicator() {
            const isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';
            const ind = document.getElementById('alarm-indicator');
            if (isEnabled) ind.classList.replace('hidden', 'block');
            else ind.classList.replace('block', 'hidden');
        }

        function openAlarmSettings() {
            unlockAudio(); 
            const modalId = 'alarm-modal-' + Date.now();
            let currentInt = localStorage.getItem('rimpang-alarm-interval') || 3;
            let isEnabled = localStorage.getItem('rimpang-alarm-enabled') === 'true';

            const modalHtml = `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-60 no-print animate-fade-in-up">
                <div class="bg-white rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
                    <div class="flex items-center text-amber-600 mb-4">
                        <i class="fas fa-clock text-2xl mr-3"></i><h4 class="text-xl font-bold">Pengaturan Alarm</h4>
                    </div>
                    <div class="mb-4 flex justify-between bg-slate-50 p-3 rounded border border-slate-200">
                        <div class="font-semibold">Status Alarm</div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="alarm-toggle" class="sr-only peer" ${isEnabled ? 'checked' : ''}>
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-amber-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                        </label>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2">Ingatkan setiap (Jam):</label>
                        <input type="number" id="alarm-int" value="${currentInt}" min="0.01" step="0.1" class="w-full border rounded px-3 py-2">
                    </div>
                    <div class="flex justify-end gap-3">
                        <button id="cancel-${modalId}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-medium">Batal</button>
                        <button id="save-${modalId}" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded font-medium">Simpan</button>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById(`cancel-${modalId}`).onclick = () => document.getElementById(modalId).remove();
            document.getElementById(`save-${modalId}`).onclick = () => {
                const toggleVal = document.getElementById('alarm-toggle').checked;
                const intervalVal = Math.max(parseFloat(document.getElementById('alarm-int').value) || 3, 0.01);
                
                localStorage.setItem('rimpang-alarm-enabled', toggleVal);
                localStorage.setItem('rimpang-alarm-interval', intervalVal);

                if (toggleVal) {
                    localStorage.setItem('rimpang-alarm-next-time', Date.now() + (intervalVal * 3600000));
                    if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();
                    showToast(`Alarm diaktifkan! Berbunyi dalam ${intervalVal} jam.`);
                }
                updateAlarmIndicator();
                document.getElementById(modalId).remove();
            };
        }

        function checkIfTimeToAlert() {
            if (localStorage.getItem('rimpang-alarm-enabled') !== 'true') return;
            const nextTime = parseInt(localStorage.getItem('rimpang-alarm-next-time'));
            if (nextTime && Date.now() >= nextTime) {
                triggerAlarmAction();
                const intervalVal = parseFloat(localStorage.getItem('rimpang-alarm-interval')) || 3;
                localStorage.setItem('rimpang-alarm-next-time', Date.now() + (intervalVal * 3600000));
            }
        }

        function triggerAlarmAction() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const playNote = (time, freq, dur) => {
                    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.value = freq; gain.gain.setValueAtTime(0.3, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
                    osc.start(time); osc.stop(time + dur);
                };
                const t = audioCtx.currentTime;
                playNote(t, 880, 0.3); playNote(t + 0.4, 880, 0.3); playNote(t + 0.8, 1046.5, 0.5); 
            } catch (e) {}

            const modalId = 'alarm-trigger-' + Date.now();
            document.body.insertAdjacentHTML('beforeend', `
            <div id="${modalId}" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900 bg-opacity-80 animate-fade-in-up">
                <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center border-4 border-amber-400">
                    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-amber-100 mb-6 animate-pulse-ring">
                        <i class="fas fa-bell text-4xl text-amber-500 animate-bounce"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">Waktunya Update!</h2>
                    <p class="mb-8">Jangan lupa update progres pekerjaan hari ini.</p>
                    <button id="ok-${modalId}" class="w-full px-4 py-3 bg-slate-800 text-white font-bold rounded-lg shadow-lg">Oke, Cek Sekarang</button>
                </div>
            </div>`);
            document.getElementById(`ok-${modalId}`).onclick = () => document.getElementById(modalId).remove();
            
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Rimpang Digital - Update Progress", { body: "Silakan update checklist." });
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
